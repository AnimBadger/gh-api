$kind: http-request
url: "{{base_url}}/messages/send"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "From": "{{from}}",
        "To": "{{to}}",
        "Content": "Test message",
        "RegisteredDelivery": true
    }
auth:
  type: basic
  credentials:
    username: "{{clientid}}"
    password: "{{clientsecret}}"
order: 2000
