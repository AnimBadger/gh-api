$kind: http-example
request:
  url: "{{baseUrl}}/api/otp/generate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "number": "233502027128",
        "sender_id": "MyApp",
        "expiry": 5,
        "length": 6,
        "medium": "sms",
        "message": "string",
        "type": "numeric"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "1000",
        "message": "string",
        "ussd_code": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "1000"
          },
          "message": {
            "type": "string"
          },
          "ussd_code": {
            "type": "string"
          }
        }
      }
order: 1000
