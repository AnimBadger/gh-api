$kind: http-example
request:
  url: "{{baseUrl}}/api/otp/verify"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
    api-key: "{{apiKey}}"
  body:
    type: json
    content: |-
      {
        "code": "123456",
        "number": "233502027128"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "1100",
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "1100"
          },
          "message": {
            "type": "string"
          }
        }
      }
order: 1000
